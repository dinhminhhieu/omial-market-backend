  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6380:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP port, app connect vào đây
      - "15672:15672"   # Management UI, mở browser vào localhost:15672

volumes:
  postgres_auth_data:
  postgres_product_data:
  postgres_order_data:
  postgres_inventory_data: