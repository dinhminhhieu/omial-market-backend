services:
  postgres-auth:
    image: postgres:16
    container_name: postgres-auth
    environment:
      POSTGRES_DB: omial_auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  postgres-product:
    image: postgres:16
    container_name: postgres-product
    environment:
      POSTGRES_DB: omial_product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    volumes:
      - postgres_product_data:/var/lib/postgresql/data

  # postgres-order:
  #   image: postgres:16
  #   container_name: postgres-order
  #   environment:
  #     POSTGRES_DB: omial_order_db
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5435:5432"
  #   volumes:
  #     - postgres_order_data:/var/lib/postgresql/data

  postgres-inventory:
    image: postgres:16
    container_name: postgres-inventory
    environment:
      POSTGRES_DB: omial_inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5436:5432'
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data

  # postgres-promotion:
  #   image: postgres:16
  #   container_name: postgres-promotion
  #   environment:
  #     POSTGRES_DB: omial_promotion_db
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5437:5432"
  #   volumes:
  #     - postgres_promotion_data:/var/lib/postgresql/data

  # MinIO — object storage S3-compatible chạy local (thay cho AWS S3).
  # :9000 = S3 API (SDK + xem ảnh)
  # :9001 = Web console (đăng nhập minioadmin/minioadmin)
  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  # Chạy 1 lần mỗi lần `up`: tạo bucket + cho phép ĐỌC public (xem ảnh không cần ký,
  # còn GHI vẫn phải qua presigned URL). Idempotent — chạy lại không sao.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/omial-media;
      mc anonymous set download local/omial-media;
      exit 0"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - '6380:6379'

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - '5672:5672' # AMQP port, app connect vào đây
      - '15672:15672' # Management UI, mở browser vào localhost:15672

volumes:
  minio_data:
  postgres_auth_data:
  postgres_product_data:
  postgres_order_data:
  postgres_inventory_data:
  postgres_promotion_data:
